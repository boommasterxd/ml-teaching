name: Cache lifecycle

on:
  pull_request_target:
    branches: [main]
    types: [closed]
  workflow_run:
    workflows:
      - CI
      - Commit Style Check
      - Dependabot auto-merge
      - Secret scan
      - Update gitleaks version
      - Dependency cache
      - Copilot
      - Copilot code review
      - Copilot cloud agent
      - Dependabot Updates
    types: [completed]

permissions:
  contents: read

concurrency:
  group: cache-lifecycle
  cancel-in-progress: false

jobs:
  cleanup:
    name: Retire eligible caches
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.x'
          check-latest: true
          package-manager-cache: false
      - name: Verify current trusted source and eligible cache identities
        run: node .github/scripts/cache-lifecycle/run.cjs .github/cache-policy.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
