name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}-${{ github.event.action == 'edited' && !github.event.changes.base && github.run_id || 'checks' }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  plan:
    name: Select checks
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      quality: ${{ steps.plan.outputs.quality }}
      browser: ${{ steps.plan.outputs.browser }}
      merge: ${{ steps.plan.outputs.merge }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.x'
          check-latest: true
      - id: plan
        run: node .github/scripts/plan-ci.ts
        env:
          CHANGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHANGE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGE_MERGE_SHA: ${{ github.sha }}

  quality:
    name: Quality and unit coverage
    needs: plan
    if: needs.plan.outputs.quality == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.x'
          check-latest: true
          package-manager-cache: false
      - name: Validate source revision
        run: node .github/scripts/validate-ci.ts
        env:
          CI_PLAN: ${{ needs.plan.outputs.plan }}
          CHANGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHANGE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGE_MERGE_SHA: ${{ github.sha }}
      - name: Resolve compatible npm cache
        id: cache-config
        continue-on-error: true
        run: node .github/scripts/cache.ts configure
        env:
          CACHE_INPUT_HASH: ${{ hashFiles('package.json', 'package-lock.json', '.npmrc', '.github/scripts/cache.ts', '.github/workflows/ci.yml', '.github/workflows/dependency-cache.yml') }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        if: steps.cache-config.outcome == 'success'
        continue-on-error: true
        with:
          path: ${{ steps.cache-config.outputs.path }}
          key: ${{ steps.cache-config.outputs.key }}
          restore-keys: ${{ steps.cache-config.outputs.prefix }}
      - name: Record restore evidence
        continue-on-error: true
        run: node .github/scripts/cache.ts summary
        env:
          CACHE_PRIMARY_KEY: ${{ steps.cache.outputs.cache-primary-key }}
          CACHE_MATCHED_KEY: ${{ steps.cache.outputs.cache-matched-key }}
          CACHE_RESTORE_OUTCOME: ${{ steps.cache.outcome }}
      - run: npm ci --no-audit
      - run: npm run ci

  browser:
    name: Production browser checks
    needs: plan
    if: needs.plan.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.x'
          check-latest: true
          package-manager-cache: false
      - name: Validate source revision
        run: node .github/scripts/validate-ci.ts
        env:
          CI_PLAN: ${{ needs.plan.outputs.plan }}
          CHANGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHANGE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGE_MERGE_SHA: ${{ github.sha }}
      - name: Resolve compatible npm cache
        id: cache-config
        continue-on-error: true
        run: node .github/scripts/cache.ts configure
        env:
          CACHE_INPUT_HASH: ${{ hashFiles('package.json', 'package-lock.json', '.npmrc', '.github/scripts/cache.ts', '.github/workflows/ci.yml', '.github/workflows/dependency-cache.yml') }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        if: steps.cache-config.outcome == 'success'
        continue-on-error: true
        with:
          path: ${{ steps.cache-config.outputs.path }}
          key: ${{ steps.cache-config.outputs.key }}
          restore-keys: ${{ steps.cache-config.outputs.prefix }}
      - name: Record restore evidence
        continue-on-error: true
        run: node .github/scripts/cache.ts summary
        env:
          CACHE_PRIMARY_KEY: ${{ steps.cache.outputs.cache-primary-key }}
          CACHE_MATCHED_KEY: ${{ steps.cache.outputs.cache-matched-key }}
          CACHE_RESTORE_OUTCOME: ${{ steps.cache.outcome }}
      - run: npm ci --no-audit
      - run: npm run build
      - name: Install the locked Chromium headless shell
        run: npx --no-install playwright install --only-shell chromium
      - run: npm run test:e2e
      - name: Enforce Lighthouse performance budgets
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/lighthouse-next.log"
          setsid npm start -- --hostname 127.0.0.1 --port 3100 > "$log" 2>&1 &
          server_pid=$!
          trap 'kill -TERM -- "-$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          for ((attempt=0; attempt<30; attempt++)); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            if curl --fail --silent --max-time 1 http://127.0.0.1:3100/ > /dev/null; then
              npm run test:lighthouse -- --all --locked
              exit 0
            fi
            sleep 1
          done
          cat "$log"
          exit 1
        timeout-minutes: 20

  CI:
    name: CI
    if: always()
    needs: [plan, quality, browser]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.x'
          check-latest: true
      - name: Require every selected check
        run: node .github/scripts/validate-ci.ts
        env:
          CI_PLAN: ${{ needs.plan.outputs.plan }}
          CI_RESULTS: '{"plan":"${{ needs.plan.result }}","quality":"${{ needs.quality.result }}","browser":"${{ needs.browser.result }}"}'
          CHANGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHANGE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGE_MERGE_SHA: ${{ github.sha }}
      - name: Verified PR revisions ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} ${{ github.sha }}
        if: fromJSON(needs.plan.outputs.plan).reason != 'verified-revision'
        run: echo 'Required checks passed for the checked-out revisions.'
      - name: Reused PR revisions ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} ${{ github.sha }}
        if: fromJSON(needs.plan.outputs.plan).reason == 'verified-revision'
        run: echo 'Required checks already passed for the checked-out revisions.'
