name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: >-
    ci-${{ github.run_attempt > 1 && format('retry-{0}', github.run_id)
    || (github.event.action == 'edited' && !github.event.changes.base)
    && format('metadata-{0}-{1}', github.event.pull_request.number, github.sha)
    || format('pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: ${{ github.run_attempt == 1 && (github.event.action != 'edited' || github.event.changes.base != null) }}

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  plan:
    name: Select checks
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      quality: ${{ steps.plan.outputs.quality }}
      browser: ${{ steps.plan.outputs.browser }}
      merge: ${{ steps.plan.outputs.merge }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.x'
          check-latest: true
      - id: plan
        run: node .github/scripts/plan-ci.ts
        env:
          CHANGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHANGE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGE_MERGE_SHA: ${{ github.sha }}

  quality:
    name: Quality and unit coverage
    needs: plan
    if: needs.plan.outputs.quality == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.x'
          check-latest: true
          package-manager-cache: false
      - name: Validate source revision
        run: node .github/scripts/validate-ci.ts
        env:
          CI_PLAN: ${{ needs.plan.outputs.plan }}
          CHANGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHANGE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGE_MERGE_SHA: ${{ github.sha }}
      - name: Resolve compatible npm cache
        id: cache-config
        continue-on-error: true
        run: node .github/scripts/cache.ts configure
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        if: steps.cache-config.outcome == 'success'
        continue-on-error: true
        with:
          path: ${{ steps.cache-config.outputs.path }}
          key: ${{ steps.cache-config.outputs.key }}
          restore-keys: ${{ steps.cache-config.outputs.prefix }}
      - name: Record restore evidence
        continue-on-error: true
        run: node .github/scripts/cache.ts summary
        env:
          CACHE_PRIMARY_KEY: ${{ steps.cache.outputs.cache-primary-key }}
          CACHE_MATCHED_KEY: ${{ steps.cache.outputs.cache-matched-key }}
          CACHE_RESTORE_OUTCOME: ${{ steps.cache.outcome }}
      - run: npm ci --no-audit
      - run: npm run ci

  browser:
    name: Production browser checks
    needs: plan
    if: needs.plan.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.x'
          check-latest: true
          package-manager-cache: false
      - name: Validate source revision
        run: node .github/scripts/validate-ci.ts
        env:
          CI_PLAN: ${{ needs.plan.outputs.plan }}
          CHANGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHANGE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGE_MERGE_SHA: ${{ github.sha }}
      - name: Resolve compatible npm cache
        id: cache-config
        continue-on-error: true
        run: node .github/scripts/cache.ts configure
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        if: steps.cache-config.outcome == 'success'
        continue-on-error: true
        with:
          path: ${{ steps.cache-config.outputs.path }}
          key: ${{ steps.cache-config.outputs.key }}
          restore-keys: ${{ steps.cache-config.outputs.prefix }}
      - name: Record restore evidence
        continue-on-error: true
        run: node .github/scripts/cache.ts summary
        env:
          CACHE_PRIMARY_KEY: ${{ steps.cache.outputs.cache-primary-key }}
          CACHE_MATCHED_KEY: ${{ steps.cache.outputs.cache-matched-key }}
          CACHE_RESTORE_OUTCOME: ${{ steps.cache.outcome }}
      - run: npm ci --no-audit
      - run: npm run build
      - name: Install the locked Chromium browser and headless shell
        run: npx --no-install playwright install chromium
      - name: Run the selected production browser checks
        run: node .github/scripts/browser-ci.ts
        env:
          CI_PLAN: ${{ needs.plan.outputs.plan }}
          CHANGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHANGE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGE_MERGE_SHA: ${{ github.sha }}

  CI:
    name: CI
    if: always()
    needs: [plan, quality, browser]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.x'
          check-latest: true
      - name: Require every selected check
        run: node .github/scripts/validate-ci.ts --results
        env:
          CI_PLAN: ${{ needs.plan.outputs.plan }}
          CI_RESULTS: '{"plan":"${{ needs.plan.result }}","quality":"${{ needs.quality.result }}","browser":"${{ needs.browser.result }}"}'
          CHANGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHANGE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGE_MERGE_SHA: ${{ github.sha }}
      - name: Verified PR revisions ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} ${{ github.sha }}
        if: fromJSON(needs.plan.outputs.plan).reason != 'verified-revision'
        run: echo 'Required checks passed for the checked-out revisions.'
      - name: Reused PR revisions ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} ${{ github.sha }}
        if: fromJSON(needs.plan.outputs.plan).reason == 'verified-revision'
        run: echo 'Required checks already passed for the checked-out revisions.'
