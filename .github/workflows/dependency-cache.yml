name: Dependency cache

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .npmrc
      - .github/workflows/ci.yml
      - .github/workflows/dependency-cache.yml
      - .github/workflows/cache-lifecycle.yml
      - .github/scripts/cache.ts
      - .github/scripts/cache-lifecycle/**
      - .github/cache-policy.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-cache-main
  cancel-in-progress: false

jobs:
  warm:
    name: Warm npm cache
    if: >-
      github.repository == 'boommasterxd/the-teachable-machine' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.default_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      replacements: ${{ steps.receipt.outputs.replacements }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.x'
          check-latest: true
          package-manager-cache: false
      - name: Resolve compatible npm cache
        id: cache-config
        run: node .github/scripts/cache.ts configure
        env:
          CACHE_INPUT_HASH: ${{ hashFiles('package.json', 'package-lock.json', '.npmrc', '.github/scripts/cache.ts', '.github/workflows/ci.yml', '.github/workflows/dependency-cache.yml') }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        continue-on-error: true
        with:
          path: ${{ steps.cache-config.outputs.path }}
          key: ${{ steps.cache-config.outputs.key }}
          restore-keys: ${{ steps.cache-config.outputs.prefix }}
      - name: Record restore evidence
        run: node .github/scripts/cache.ts summary
        env:
          CACHE_PRIMARY_KEY: ${{ steps.cache.outputs.cache-primary-key }}
          CACHE_MATCHED_KEY: ${{ steps.cache.outputs.cache-matched-key }}
          CACHE_RESTORE_OUTCOME: ${{ steps.cache.outcome }}
      - name: Populate the complete locked dependency store
        run: npm ci --no-audit
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.cache.outputs.cache-hit != 'true' && steps.cache.outputs.cache-primary-key != ''
        with:
          path: ${{ steps.cache-config.outputs.path }}
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Record native producer identity
        id: receipt
        if: steps.cache.outputs.cache-primary-key != ''
        run: node .github/scripts/cache.ts receipt
        env:
          CACHE_PRIMARY_KEY: ${{ steps.cache.outputs.cache-primary-key }}
          CACHE_PREFIX: ${{ steps.cache-config.outputs.prefix }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.receipt.outputs.path != ''
        with:
          name: cache-lifecycle-receipts-${{ github.run_attempt }}
          path: ${{ steps.receipt.outputs.path }}
          retention-days: 7
          if-no-files-found: error

  cleanup:
    name: Retire replaced caches
    needs: warm
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.x'
          check-latest: true
          package-manager-cache: false
      - name: Verify replacement and retire eligible caches
        run: node .github/scripts/cache-lifecycle/run.cjs .github/cache-policy.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CACHE_REPLACEMENTS: ${{ needs.warm.outputs.replacements }}
