name: Secret scan

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

concurrency:
  group: gitleaks-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'edited' && !github.event.changes.base && github.run_id || 'checks' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event.action == 'edited' && !github.event.changes.base
        with:
          node-version: '26.x'
          check-latest: true
          package-manager-cache: false
      - id: evidence
        if: github.event.action == 'edited' && !github.event.changes.base
        run: |
          test "$(git rev-parse HEAD)" = "$CHANGE_MERGE_SHA"
          node .github/scripts/pr-check-evidence.ts
        env:
          CHANGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHANGE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHANGE_MERGE_SHA: ${{ github.sha }}
      - name: Run gitleaks
        if: steps.evidence.outputs.reused != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ && "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
            [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          fi
          manifest="$RUNNER_TEMP/gitleaks-version.json"
          policy="$RUNNER_TEMP/gitleaks.toml"
          if [ -n "$BASE_SHA" ]; then
            git show "$BASE_SHA:.github/gitleaks-version.json" > "$manifest" 2>/dev/null \
              || git show "$BASE_SHA:.gitleaks-version" > "$manifest"
            git show "$BASE_SHA:.github/gitleaks.toml" > "$policy" 2>/dev/null \
              || printf '[extend]\nuseDefault = true\n' > "$policy"
          else
            cp .github/gitleaks-version.json "$manifest"
            cp .github/gitleaks.toml "$policy"
          fi
          ver=$(jq -er '.version | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' "$manifest")
          sum=$(jq -er '.sha256 | select(test("^[a-f0-9]{64}$"))' "$manifest")
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --max-time 60 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz" -o "$archive"
          printf '%s  %s\n' "$sum" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          # Gitleaks also reads source/.gitleaksignore independently of its flag.
          # There are no reviewed fingerprints; the Git range still scans this path.
          rm -f .gitleaksignore
          "$RUNNER_TEMP/gitleaks" dir --config "$policy" --gitleaks-ignore-path /dev/null --ignore-gitleaks-allow --timeout 180 --no-banner --redact --exit-code 1 .
          if [ -n "$BASE_SHA" ]; then
            "$RUNNER_TEMP/gitleaks" git --config "$policy" --gitleaks-ignore-path /dev/null --ignore-gitleaks-allow --timeout 180 --no-banner --redact --exit-code 1 --log-opts="$BASE_SHA..$HEAD_SHA" .
          else
            "$RUNNER_TEMP/gitleaks" git --config "$policy" --gitleaks-ignore-path /dev/null --ignore-gitleaks-allow --timeout 180 --no-banner --redact --exit-code 1 .
          fi
      - name: Verified PR revisions ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} ${{ github.sha }}
        if: github.event_name == 'pull_request' && steps.evidence.outputs.reused != 'true'
        run: echo 'The required scan passed for the checked-out revisions.'
      - name: Reused PR revisions ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} ${{ github.sha }}
        if: steps.evidence.outputs.reused == 'true'
        run: echo 'The required scan already passed for the checked-out revisions.'
